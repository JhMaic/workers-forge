name: Release & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create GitHub Releases
      id-token: write 

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Determine dist-tag and release type
        id: meta
        run: |
          TAG="${{ github.ref_name }}"          # e.g. v1.0.4 or v1.0.4-beta.0
          VERSION="${TAG#v}"                     # strip leading 'v'

          if [[ "$VERSION" == *-* ]]; then
            # Extract the prerelease identifier: "1.0.4-beta.0" → "beta"
            DIST_TAG=$(echo "$VERSION" | sed 's/[0-9]*\.[0-9]*\.[0-9]*-\([a-zA-Z]*\).*/\1/')
            PRERELEASE=true
          else
            DIST_TAG="latest"
            PRERELEASE=false
          fi

          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG"     >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # --ignore-scripts skips prepublishOnly (build+test already ran above)
        run: npm publish --tag ${{ steps.meta.outputs.dist_tag }} --access public --ignore-scripts --provenance

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ${{ steps.meta.outputs.prerelease == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}